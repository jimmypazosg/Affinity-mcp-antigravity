[project]
name = "affinity-control-mcp"
version = "0.1.0"
description = "MCP server to control Serif / Canva Affinity creative apps on Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.26.0",
    "pillow>=10.0.0",
    "pyautogui>=0.9.54",
]

[project.scripts]
affinity-mcp = "server:mcp.run"
